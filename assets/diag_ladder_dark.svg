<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Test ladder: 1 our simulator with a 1,000-task exam, 2 Gazebo + PX4 with 80 flights, 3 sensors broken on purpose, 4 a real drone, next."><title>Test ladder: 1 our simulator with a 1,000-task exam, 2 Gazebo + PX4 with 80 flights, 3 sensors broken on purpose, 4 a real drone, next.</title><style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8b82"/></marker></defs><rect x="1" y="1" width="998" height="198" rx="16" fill="#171717" stroke="#2f2d2a" stroke-width="1.2"/><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="0.20s" fill="freeze"/><rect x="30" y="104" width="220" height="76" rx="14" fill="#D91F32" stroke="#D91F32" stroke-width="2"/><text x="140.0" y="136.0" text-anchor="middle" font-size="18" font-weight="800" letter-spacing=".04em" fill="#F5F3EE">1 · OUR SIMULATOR</text><text x="140.0" y="160.0" text-anchor="middle" font-size="13.5" fill="#ffd6da">1,000-task exam</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".4s" begin="0.40s" fill="freeze"/><line x1="250" y1="142" x2="268" y2="112" stroke="#8f8b82" stroke-width="2.4" marker-end="url(#ah)"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="0.55s" fill="freeze"/><rect x="270" y="74" width="220" height="76" rx="14" fill="#24231f" stroke="#2f2d2a" stroke-width="2"/><text x="380.0" y="106.0" text-anchor="middle" font-size="18" font-weight="800" letter-spacing=".04em" fill="#F5F3EE">2 · GAZEBO + PX4</text><text x="380.0" y="130.0" text-anchor="middle" font-size="13.5" fill="#c9c5bc">80 flights</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".4s" begin="0.75s" fill="freeze"/><line x1="490"