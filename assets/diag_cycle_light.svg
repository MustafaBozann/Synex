<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="One decision cycle: sensors and memory feed the brain, a rule-based safety layer checks its command, then PX4 flies it. 30 times a second."><title>One decision cycle: sensors and memory feed the brain, a rule-based safety layer checks its command, then PX4 flies it. 30 times a second.</title><style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a766d"/></marker></defs><rect x="1" y="1" width="998" height="298" rx="16" fill="#F5F3EE" stroke="#dcd7cc" stroke-width="1.2"/><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="0.10s" fill="freeze"/><rect x="30" y="50" width="210" height="86" rx="14" fill="#ffffff" stroke="#dcd7cc" stroke-width="2"/><text x="135.0" y="87.0" text-anchor="middle" font-size="18" font-weight="800" letter-spacing=".04em" fill="#171717">SENSORS</text><text x="135.0" y="111.0" text-anchor="middle" font-size="13.5" fill="#4a4740">depth camera + detector</text><text x="135.0" y="128.0" text-anchor="middle" font-size="13.5" fill="#4a4740">small distance sensors</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="0.30s" fill="freeze"/><rect x="30" y="172" width="210" height="76" rx="14" fill="#ffffff" stroke="#dcd7cc" stroke-width="2"/><text x="135.0" y="204.0" text-anchor="middle" font-size="18" font-weight="800" letter-spacing=".04em" fill="#171717">MEMORY</text><text x="135.0" y="228.0" text-anchor="middle" font-size="13.5" fill="#4a4740">local map and route</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="0.50s" fill="freeze"/><rect x="300" y="104" width="190" height="92" rx="14" fill="#D91F32" stroke="#D91F32" stroke-width="2"/><text x="395.0" y="144.0" text-anchor="middle" font-size="18" font-weight="800" letter-spacing=".04em" fill="#F5F3EE">BRAIN</text><text x="395.0" y="168.0" text-anchor="middle" font-size="13.5" fill="#ffd6da">neural network</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="0.90s" fill="freeze"/><rect x="570" y="104" width="190" height="92" rx="14" fill="#ffffff" stroke="#dcd7cc" stroke-width="2"/><text x="665.0" y="144.0" text-anchor="middle" font-size="18" font-weight="800" letter-spacing=".04em" fill="#171717">SAFETY LAYER</text><text x="665.0" y="168.0" text-anchor="middle" font-size="13.5" fill="#4a4740">rule-based check</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.20s" fill="freeze"/><rect x="820" y="104" width="150" height="92" rx="14" fill="#ffffff" stroke="#dcd7cc" stroke-width="2"/><text x="895.0" y="144.0" text-anchor="middle" font-size="18" font-weight="800" letter-spacing=".04em" fill="#171717">PX4</text><text x="895.0" y="168.0" text-anchor="middle" font-size="13.5" fill="#4a4740">flight controller</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".4s" begin="0.40s" fill="freeze"/><line x1="240" y1="93" x2="298" y2="135" stroke="#7a766d" stroke-width="2.4" marker-end="url(#ah)"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".4s" begin="0.40s" fill="freeze"/><line x1="240" y1="210" x2="298" y2="168" stroke="#7a766d" stroke-width="2.4" marker-end="url(#ah)"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".4s" begin="0.80s" fill="freeze"/><line x1="490" y1="150" x2="568" y2="150" stroke="#7a766d" stroke-width="2.4" marker-end="url(#ah)"/><text x="529" y="138" text-anchor="middle" font-size="13" fill="#4a4740">proposed</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".4s" begin="1.10s" fill="freeze"/><line x1="760" y1="150" x2="818" y2="150" stroke="#7a766d" stroke-width="2.4" marker-end="url(#ah)"/><text x="789" y="138" text-anchor="middle" font-size="13" fill="#4a4740">safe</text></g><text x="500" y="276" text-anchor="middle" font-size="13" fill="#4a4740" opacity="0">One decision cycle. It repeats 30 times a second.<animate attributeName="opacity" values="0;1" dur=".5s" begin="1.4s" fill="freeze"/></text><circle r="7" fill="#D91F32" stroke="#F5F3EE" stroke-width="2" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"/><animateMotion path="M135 93 L395 150 L665 150 L895 150" dur="1.6s" begin="1.6s" repeatCount="indefinite"/></circle></svg>