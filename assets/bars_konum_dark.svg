<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-label="What slows it down: knowing where it is. The 45 hardest flights, flown again with one error source changed at a time."><title>What slows it down: knowing where it is. The 45 hardest flights, flown again with one error source changed at a time.</title><style>text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;} .t1{font-size:21px;font-weight:600;fill:#F5F3EE} .t2{font-size:14px;fill:#c9c5bc} .lb{font-size:14px;fill:#F5F3EE} .mu{font-size:12.5px;fill:#8f8b82} </style><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#D91F32"/><line x1="0" y1="0" x2="0" y2="6" stroke="#ffb3bb" stroke-width="1.2"/></pattern></defs><rect x="1" y="1" width="958" height="348" rx="16" fill="#171717" stroke="#2f2d2a" stroke-width="1.2"/><text x="32" y="50" class="t1">What slows it down: knowing where it is</text><text x="32" y="78" class="t2">The 45 hardest flights, flown again with one error source changed at a time.</text><line x1="290.0" y1="104" x2="290.0" y2="276" stroke="#262523"/><text x="290.0" y="294" class="mu" text-anchor="middle">0</text><line x1="443.3" y1="104" x2="443.3" y2="276" stroke="#262523"/><text x="443.3" y="294" class="mu" text-anchor="middle">15</text><line x1="596.7" y1="104" x2="596.7" y2="276" stroke="#262523"/><text x="596.7" y="294" class="mu" text-anchor="middle">30</text><line x1="750.0" y1="104" x2="750.0" y2="276" stroke="#262523"/><text x="750.0" y="294" class="mu" text-anchor="middle">45</text><line x1="290" y1="276" x2="750" y2="276" stroke="#2f2d2a"/><text x="274" y="143.7" class="lb" text-anchor="end">All harsh errors</text><clipPath id="c0"><rect x="290" y="121.7" height="33.9" width="0"><animate attributeName="width" values="0;464.0" dur="1.1s" begin="0.25s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/></rect></clipPath><g clip-path="url(#c0)"><rect x="290.0" y="123.7" width="92.0" height="29.9" rx="4" fill="#F5F3EE" stroke="#171717" stroke-width="2"/><rect x="382.0" y="123.7" width="368.0" height="29.9" rx="4" fill="#7d7a73" stroke="#171717" stroke-width="2"/></g><text x="762.0" y="143.7" class="lb" opacity="0">36 time-outs<animate attributeName="opacity" values="0;1" dur=".5s" begin="1.05s" fill="freeze"/></text><text x="274" y="197.0" class="lb" text-anchor="end">Harsh position error only</text><clipPath id="c1"><rect x="290" y="175.1" height="33.9" width="0"><animate attributeName="width" values="0;464.0" dur="1.1s" begin="0.39s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/></rect></clipPath><g clip-path="url(#c1)"><rect x="290.0" y="177.1" width="235.1" height="29.9" rx="4" fill="#F5F3EE" stroke="#171717" stroke-width="2"/><rect x="525.1" y="177.1" width="224.9" height="29.9" rx="4" fill="#7d7a73" stroke="#171717" stroke-width="2"/></g><text x="762.0" y="197.0" class="lb" opacity="0">22 time-outs<animate attributeName="opacity" values="0;1" dur=".5s" begin="1.19s" fill="freeze"/></text><text x="274" y="241.8" class="lb" text-anchor="end">Position error 15 cm,</text><text x="274" y="258.8" class="lb" text-anchor="end">other harsh errors kept</text><clipPath id="c2"><rect x="290" y="228.4" height="33.9" width="0"><animate attributeName="width" values="0;464.0" dur="1.1s" begin="0.53s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/></rect></clipPath><g clip-path="url(#c2)"><rect x="290.0" y="230.4" width="337.3" height="29.9" rx="4" fill="#F5F3EE" stroke="#171717" stroke-width="2"/><rect x="627.3" y="230.4" width="102.2" height="29.9" rx="4" fill="#7d7a73" stroke="#171717" stroke-width="2"/><rect x="729.6" y="230.4" width="20.4" height="29.9" rx="4" fill="url(#hatch)" stroke="#171717" stroke-width="2"/></g><text x="762.0" y="250.3" class="lb" opacity="0">10 time-outs · 2 crashes<animate attributeName="opacity" values="0;1" dur=".5s" begin="1.33s" fill="freeze"/></text><rect x="290" y="312" width="14" height="14" rx="3" fill="#F5F3EE" stroke="none"/><text x="312" y="324" class="mu">Reached goal</text><rect x="437.2" y="312" width="14" height="14" rx="3" fill="#7d7a73" stroke="none"/><text x="459.2" y="324" class="mu">Timed out</text><rect x="561.6" y="312" width="14" height="14" rx="3" fill="url(#hatch)" stroke="#2f2d2a"/><text x="583.6" y="324" class="mu">Crash</text></svg>